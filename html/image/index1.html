<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>List</h1>
    <!-- unordered list -->
    <ul type="square">
        <li>Milk</li>
        <li>eggs</li>
        <li>Bread</li>
    </ul>
<!-- ordered list -->
<ol type="A">
    <li>mango</li>
    <li>apple</li>
    <li>orange</li>
</ol>
<!-- description list -->
<dl>
    <dt>HTML</dt>
    <dd>Hypertext Markup Language</dd>
    <dt>CSS</dt>
    <dd>Cascading Style Sheets</dd>
    <dt>JS</dt>
    <dd>JavaScript</dd>
 
</body>
</html>
